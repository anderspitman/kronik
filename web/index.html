<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kronik</title>
  <script>
    (() => {
      try {
        const theme = window.localStorage.getItem("kronik-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {
        // Ignore storage failures and fall back to the default theme.
      }
    })();
  </script>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main class="app-shell">
    <header class="status-bar">
      <p class="status-line">
        <span class="status-label">Connection</span>
        <span id="status-text">Connect to a WebDAV directory to begin.</span>
      </p>
      <div class="status-actions">
        <button id="load-button" class="primary">Load data</button>
        <button id="theme-toggle-button" type="button">Dark mode</button>
        <span id="config-summary-text" class="config-summary-text">No server saved.</span>
      </div>
      <details id="config-menu" class="config-menu">
        <summary class="config-summary">
          <span class="config-summary-action">Server</span>
        </summary>
        <form id="config-form" class="config-grid" autocomplete="off">
          <label>
            <span>Base URL</span>
            <input id="webdav-url" name="webdav-url" type="url" placeholder="https://dav.example.com/kronik" required>
          </label>
          <label>
            <span>Username</span>
            <input id="webdav-user" name="webdav-user" type="text" placeholder="Optional">
          </label>
          <label>
            <span>Password</span>
            <input id="webdav-password" name="webdav-password" type="password" placeholder="Optional">
          </label>
          <div class="config-actions">
            <button id="clear-config-button" type="button">Forget saved login</button>
          </div>
        </form>
      </details>
    </header>

    <section class="panel">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Projects</p>
          <h2>Today</h2>
        </div>
        <p id="today-label" class="today-label">No data loaded</p>
      </div>
      <form id="project-form" class="project-form" autocomplete="off">
        <input id="project-name" name="project-name" type="text" maxlength="64" placeholder="Add a new project" required>
        <button type="submit" class="primary">Add project</button>
        <button id="save-button" type="button">Save all changes</button>
      </form>
      <div id="projects-empty" class="empty-state">No projects yet.</div>
      <div id="projects-list" class="projects-list"></div>
    </section>
  </main>

  <template id="project-template">
    <article class="project-card">
      <div class="project-main">
        <div>
          <h3 class="project-name"></h3>
          <p class="project-meta"></p>
        </div>
        <div class="project-actions">
          <button class="decrement" type="button">-15m</button>
          <div class="today-total"></div>
          <button class="increment" type="button">+15m</button>
        </div>
      </div>
      <div class="project-footer">
        <span class="project-total"></span>
        <span class="project-modified"></span>
      </div>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
