<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kronik</title>
  <script>
    (() => {
      try {
        const theme = window.localStorage.getItem("kronik-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {
        // Ignore storage failures and fall back to the default theme.
      }
    })();
  </script>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main class="app-shell">
    <header class="status-bar">
      <p class="status-line">
        <span class="status-label">Connection</span>
        <span id="status-text">Connect to a WebDAV directory to begin.</span>
      </p>
      <div class="status-actions">
        <p id="today-label" class="today-label">No data loaded</p>
        <button id="save-button" type="button">Save all changes</button>
        <details id="project-menu" class="control-menu">
          <summary class="control-summary">
            <span class="control-summary-action">Add project</span>
          </summary>
          <div class="control-panel">
            <form id="project-form" class="project-form" autocomplete="off">
              <input id="project-name" name="project-name" type="text" maxlength="64" placeholder="Add a new project" required>
              <button type="submit" class="primary">Add project</button>
            </form>
          </div>
        </details>
        <button id="theme-toggle-button" type="button">Dark mode</button>
        <details id="config-menu" class="control-menu">
          <summary class="control-summary">
            <span class="control-summary-action">Server</span>
          </summary>
          <div class="control-panel control-panel-wide">
            <div class="control-panel-header">
              <p class="control-panel-title">Connection</p>
              <p id="config-summary-text" class="config-summary-text">No server saved.</p>
            </div>
            <div class="control-inline-actions">
              <button id="load-button" type="button" class="primary">Load data</button>
            </div>
            <form id="config-form" class="config-grid" autocomplete="off">
              <label>
                <span>Base URL</span>
                <input id="webdav-url" name="webdav-url" type="url" placeholder="https://dav.example.com/kronik" required>
              </label>
              <label>
                <span>Username</span>
                <input id="webdav-user" name="webdav-user" type="text" placeholder="Optional">
              </label>
              <label>
                <span>Password</span>
                <input id="webdav-password" name="webdav-password" type="password" placeholder="Optional">
              </label>
              <div class="config-actions">
                <button id="clear-config-button" type="button">Forget saved login</button>
              </div>
            </form>
          </div>
        </details>
      </div>
    </header>

    <section class="clock-panel">
      <div id="clock-buttons" class="clock-buttons" aria-label="Time card controls"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <p class="eyebrow">All projects</p>
          <h2>Tracked hours</h2>
        </div>
        <p id="overview-total" class="panel-note">Load data to see project totals.</p>
      </div>
      <div id="overview-empty" class="empty-state">Load data to see daily project hours.</div>
      <div id="overview-chart" class="project-overview is-hidden">
        <div class="project-history project-overview-history">
          <div class="project-history-header">
            <span class="project-history-label">Daily hours by project</span>
            <span id="overview-range" class="project-history-range"></span>
          </div>
          <div id="overview-history-chart" class="project-history-chart"></div>
        </div>
        <div class="project-history project-overview-timeline">
          <div class="project-history-header">
            <span class="project-history-label">Project timeline</span>
          </div>
          <div id="overview-timeline-chart" class="project-timeline-chart"></div>
        </div>
        <div id="overview-legend" class="project-overview-legend"></div>
      </div>
    </section>

    <section class="panel">
      <p class="eyebrow section-eyebrow">Projects</p>
      <div id="projects-empty" class="empty-state">No projects yet.</div>
      <div id="projects-list" class="projects-list"></div>
    </section>
  </main>

  <div id="chart-tooltip" class="chart-tooltip" aria-hidden="true">
    <div id="chart-tooltip-date" class="chart-tooltip-date"></div>
    <div id="chart-tooltip-value" class="chart-tooltip-value"></div>
  </div>

  <template id="project-template">
    <article class="project-card">
      <div class="project-main">
        <div>
          <h3 class="project-name"></h3>
          <p class="project-meta"></p>
        </div>
        <div class="today-total"></div>
      </div>
      <div class="project-footer">
        <span class="project-total"></span>
        <span>Today</span>
      </div>
      <div class="project-history">
        <div class="project-history-header">
          <span class="project-history-label">Daily hours</span>
          <span class="project-history-range"></span>
        </div>
        <div class="project-history-chart"></div>
      </div>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
